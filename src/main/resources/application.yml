spring:
  application:
    name: adg-rule
  profiles:
    active: prod  #切换至 dev 即可输出调试信息

logging:
  file:
    path: ./logs

application:
  config:
    expected_quantity: 2000000  #预期规则数量
    fault_tolerance: 0.001 #容错率
    warn_limit: 7 #警告阈值, 规则长度小于该值时会输出警告日志
    batch_size: 10000 #写入文件的批次大小

  # 规则源配置，remote为远程规则，local为本地规则，支持多个规则源
  rule:

    # 仅支持 http/https，不限定响应内容格式
    # 核心源用 217heidai/adblockfilters 的成品 DNS 列表：它已经把 AdGuard DNS filter、OISD、
    # HaGeZi PRO mini、EasyList、CJX、jiekouAD 等合并去重并做过黑名单剔除/父域收敛，
    # 相当于替我们完成了「多源交叉验证」这一步；再叠 anti-AD 补中文命中，AWAvenue 补国内广告位。
    remote:
      - name: '217heidai adblockfilters DNS' #规则名称
        path: 'https://github.com/217heidai/adblockfilters/releases/download/rule/adblockdns.txt' #规则地址
      - name: 'anti-AD 中文规则' #规则名称
        path: 'https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-easylist.txt' #规则地址
      - name: 'AWAvenue 秋风广告规则' #规则名称
        path: 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt' #规则地址
    #本地规则请将文件放置到项目路径rule目录中
    local:
      - name: '本地私有白名单'
        path: 'local-rule.txt'
  output:
    file_header: |  #输出文件头, 占位符${name}将被替换为文件名，如all.txt,  ${date} 将被替换为当前日期
      ! [关圣®云去广告DNS 去广告规则列表]
      ! Title: ${name}
      ! Last Modified: ${date}
      ! Homepage: https://github.com/xiaoran0503/adguardhome/
    path: rule   #规则文件输出路径，相对路径默认从 项目目录开始
    files:
      all.txt: #输出文件名
        - WHITELIST #例外规则，@@ 开头的放行规则，AGH 支持
        - DOMAIN  #域名规则，仅完整域名
        - REGEX   #正则规则，包含正则的域名规则，AdGH支持
        - MODIFY  #修饰规则，添加了一些修饰符号的规则，AdG支持
        - HOSTS   #Hosts规则
      dns.txt:
        - WHITELIST
        - DOMAIN
        - REGEX
        - HOSTS
      hosts.txt:
        - HOSTS
      regex.txt:
        - REGEX
      domain.txt:
        - DOMAIN
      modify.txt:
        - MODIFY
